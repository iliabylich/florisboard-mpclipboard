[task_config]
shell = "bash -euo pipefail -c"

[tools]
java = "temurin-17"
gradle = "9.2.0"
android-sdk = "17.0"

[env]
FLORISBOARD_VERSION = "v0.5.2"
GRADLE_USER_HOME = "{{config_root}}/.cache/gradle"
ANDROID_USER_HOME = "{{config_root}}/.cache/android"
ANDROID_KEY_ALIAS = "release"
FDROID_KEY_ALIAS = "debian"
_.file = { path = ".env", redacted = true }
"ORG_GRADLE_PROJECT_android.injected.signing.store.file" = "{{ env.ANDROID_KEYSTORE_PATH }}"
"ORG_GRADLE_PROJECT_android.injected.signing.store.password" = "{{ env.ANDROID_KEYSTORE_PASSWORD }}"
"ORG_GRADLE_PROJECT_android.injected.signing.key.alias" = "{{ env.ANDROID_KEY_ALIAS }}"
"ORG_GRADLE_PROJECT_android.injected.signing.key.password" = "{{ env.ANDROID_KEYSTORE_PASSWORD }}"

[tasks."setup:android-sdk"]
run = """
    (set +o pipefail; yes | sdkmanager --licenses > /dev/null)
    sdkmanager \
        "platform-tools" \
        "platforms;android-33" \
        "platforms;android-35" \
        "platforms;android-36" \
        "build-tools;30.0.3" \
        "build-tools;35.0.0" \
        "ndk;26.1.10909125" \
        "ndk;27.0.12077973" \
        "cmake;3.22.1" \
        "cmake;4.0.2"
"""
description = "Installs Android SDK"

[tasks."build:debug"]
raw = true
run = """
    : "$ANDROID_KEYSTORE_PATH" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS"

    pushd florisboard
        gradle --no-daemon --stacktrace :app:assembleDebug \
            -Pandroid.injected.signing.store.file="$ANDROID_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEYSTORE_PASSWORD"
    popd

    ls -l florisboard/app/build/outputs/apk/debug/app-debug.apk
"""
description = "Builds patched Florisboard (debug build)"


[tasks."build:release"]
raw = true
run = """
    : "$ANDROID_KEYSTORE_PATH" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS"

    if [[ ! "${BUILD_NUMBER:-}" =~ ^(0|[1-9][0-9]{0,2})$ ]]; then
        echo "BUILD_NUMBER must be an integer from 0 to 999, got '${BUILD_NUMBER:-}'" >&2
        exit 1
    fi

    pushd florisboard
        upstream_code="$(sed -n 's/^projectVersionCode=//p' gradle.properties)"
        upstream_name="$(sed -n 's/^projectVersionName=//p' gradle.properties)"
        : "${upstream_code:?}" "${upstream_name:?}"

        gradle --no-daemon --stacktrace :app:assembleRelease \
            -Pandroid.injected.signing.store.file="$ANDROID_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEYSTORE_PASSWORD" \
            -PprojectVersionCode="$((upstream_code * 1000 + BUILD_NUMBER))" \
            -PprojectVersionName="$upstream_name-$BUILD_NUMBER"
    popd

    ls -l florisboard/app/build/outputs/apk/release/app-release.apk
"""
description = "Builds patched Florisboard (release build)"

[tasks."install:debug"]
run = "adb install -r florisboard/app/build/outputs/apk/debug/app-debug.apk"

[tasks."install:release"]
run = "adb install -r florisboard/app/build/outputs/apk/release/app-release.apk"

[tasks.logs]
run = "adb logcat -v color 'MPClipboardClient:V' '*:S'"

[tasks."diff:apply"]
run = """
    pushd florisboard
        git fetch origin "refs/tags/$FLORISBOARD_VERSION:refs/tags/$FLORISBOARD_VERSION"
        git checkout --detach --force "$FLORISBOARD_VERSION"
        git apply --index ../0001-send-to-receive-from-MPClipboard.patch
    popd
"""

[tasks."diff:clean"]
run = """
    pushd florisboard
        rm -rf app/src/main/aidl
        rm -f app/src/main/kotlin/dev/patrickgold/florisboard/MPClipboardClient.kt
        git reset --hard "$FLORISBOARD_VERSION"

        git status
    popd
"""

[tasks."diff:dump"]
run = """
    pushd florisboard
        git add .
        git commit --message "send to/receive from MPClipboard" --author="MPClipboard developer <dev@mpclipboard>" --date "Wed, 1 Sep 2026 00:00:00 +0000"
        git format-patch -1 HEAD
        mv 0001-send-to-receive-from-MPClipboard.patch ..
    popd
"""

[tasks."fdroid:update"]
run = """
    pushd fdroid
        chmod 600 config.yml

        rm -rf metadata repo srclibs tmp
        mkdir -p repo

        cp ../florisboard/app/build/outputs/apk/release/app-release.apk repo/florisboard.apk

        fdroid update --verbose --create-metadata
    popd
"""
